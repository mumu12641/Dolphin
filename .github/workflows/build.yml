name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build Windows MSI
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.lock

      - name: Validate release version
        id: version
        run: python tools/prepare_release.py --check-version

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r python/requirements.lock

      - name: Test Python booking logic
        run: python -m unittest discover -s python/tests -t python -v

      - name: Test Compose and build Release MSI
        run: bash ./gradlew :composeApp:jvmTest :composeApp:packageReleaseMsi --no-daemon --console=plain --stacktrace

      - name: Collect installer and checksum
        run: python tools/prepare_release.py

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dolphin-${{ steps.version.outputs.version }}-windows-x64
          path: |
            build/release/${{ steps.version.outputs.version }}/*.msi
            build/release/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Compose test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-report-${{ github.run_id }}
          path: composeApp/build/reports/tests/jvmTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Dolphin-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Verify installer checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish MSI and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.msi release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.msi release/SHA256SUMS \
              --draft --verify-tag --title "Dolphin $RELEASE_VERSION" \
              --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "Dolphin $RELEASE_VERSION"
